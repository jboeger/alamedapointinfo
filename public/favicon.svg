<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Heritage Crimson Background -->
  <rect width="64" height="64" rx="14" fill="#8C1D18" />
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#FDE68A" stroke-opacity="0.25" stroke-width="1.5" />
  <!-- Slab-Serif "AP" Monogram -->
  <text
    x="32"
    y="39"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="27"
    letter-spacing="-0.5"
  >AP</text>
  <!-- Warm Bay Horizon Accent Line -->
  <path
    d="M14 48 Q32 44 50 48"
    fill="none"
    stroke="#FCD34D"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
